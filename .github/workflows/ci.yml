name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: rails
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: localhost

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rental_demo_development
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'

      - name: Check Ruby version
        run: ruby -v

      - name: Install dependencies
        run: bundle install

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run Brakeman
        run: bundle exec brakeman

      - name: Build Docker image
        run: docker build -t rental-demo-ci -f Dockerfile.dev .